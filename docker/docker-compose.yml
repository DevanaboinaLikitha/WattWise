
services:
  postgres:
    image: postgres:16
    container_name: wattwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattwise
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: wattwise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
