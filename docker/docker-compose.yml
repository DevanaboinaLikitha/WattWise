services:
  postgres:
    image: postgres:16
    container_name: wattwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattwise
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: wattwise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: wattwise-seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: wattwiseadmin
      AWS_SECRET_ACCESS_KEY: wattwisesecret
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    command: server -s3 -dir=/data
    volumes:
      - seaweeddata:/data

volumes:
  pgdata:
  seaweeddata:
