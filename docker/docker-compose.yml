services:
  postgres:
    image: postgres:16
    container_name: wattwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wattwise
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: wattwise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: wattwise-seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: wattwiseadmin
      AWS_SECRET_ACCESS_KEY: wattwisesecret
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    command: server -s3 -dir=/data
    volumes:
      - seaweeddata:/data

  kafka:
    image: apache/kafka:latest
    container_name: wattwise-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CLUSTER_ID: N2QMIDe6Qv2pXLLuUbqDFg
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data

volumes:
  pgdata:
  seaweeddata:
  kafkadata:
